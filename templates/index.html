<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection Curation — Wereld Museum</title>
  <style>
    :root {
      --bg:           #f0ebe0;
      --surface:      #e4ddd0;
      --card-bg:      #faf7f2;
      --card-border:  #b8a888;
      --text-on-dark: #1a1510;
      --text-muted:   #7a6e60;
      --accent:       #7a5e20;
      --accent-light: #a07828;
      --selected-bg:  #ece5d0;
      --selected-border: #b8a878;
      --serif:        Georgia, 'Times New Roman', serif;
      --mono:         'Courier New', Courier, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-on-dark);
      font-family: var(--mono);
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      padding: 28px 36px 20px;
      border-bottom: 1px solid #c8bfaf;
      display: flex;
      align-items: baseline;
      gap: 24px;
    }

    header h1 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: #1a1510;
    }

    header span {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Query bar ──────────────────────────────────────────────────────── */
    #query-bar {
      padding: 16px 36px;
      background: var(--surface);
      border-bottom: 1px solid #c8bfaf;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #query-bar label {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .cat-btn {
      background: transparent;
      border: 1px solid #b0a490;
      color: var(--text-on-dark);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .cat-btn:hover { border-color: var(--accent); color: var(--accent); }

    .cat-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    #keyword-wrap { display: flex; }

    #keyword-input {
      background: #fff;
      border: 1px solid #b0a490;
      border-right: none;
      color: var(--text-on-dark);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 6px 12px;
      width: 320px;
      outline: none;
    }

    #keyword-input::placeholder { color: var(--text-muted); }
    #keyword-input:focus { border-color: var(--accent); }

    .search-btn {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 16px;
      cursor: pointer;
      transition: background 0.12s;
    }

    .search-btn:hover { background: var(--accent-light); }
    .search-btn:disabled { opacity: 0.45; cursor: default; }

    /* ── Concept tags ───────────────────────────────────────────────────── */
    #concept-tags {
      background: rgba(180, 150, 80, 0.06);
      border-bottom: 1px solid #d8cba8;
      padding: 7px 36px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 34px;
    }

    .concept-prefix {
      color: var(--text-muted);
      font-size: 0.68rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .concept-chip {
      background: rgba(160, 120, 40, 0.1);
      border: 1px solid #c4a85a;
      border-radius: 11px;
      color: #7a5e20;
      font-family: var(--mono);
      font-size: 0.71rem;
      padding: 2px 10px;
      text-decoration: none;
      transition: background 0.1s, border-color 0.1s;
    }
    .concept-chip:hover { background: rgba(160, 120, 40, 0.22); border-color: var(--accent); }

    .concept-searching {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-style: italic;
    }
    .concept-searching::after {
      content: '';
      animation: ellipsis 1.4s steps(4, end) infinite;
    }
    @keyframes ellipsis {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }

    /* ── Main layout ────────────────────────────────────────────────────── */
    main { padding: 28px 36px 48px; }

    /* ── Pool section ───────────────────────────────────────────────────── */
    #pool-section {
      position: relative;
      overflow: hidden;
      margin-bottom: 40px;
      padding: 18px 18px 0;
      background: #e8e0ce;
      border: 1px solid #c4b898;
      /* faint vignette to suggest depth / dust */
      box-shadow: inset 0 0 60px rgba(80, 60, 20, 0.07);
    }

    .section-meta {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-stat {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* ── Card grid ──────────────────────────────────────────────────────── */
    #pool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(154px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .artifact-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }

    .artifact-card:hover { box-shadow: 0 0 0 1px var(--accent); }

    .artifact-card.kept { box-shadow: 0 0 0 2px #3d6b3d; }

    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #d6cfbe;
    }

    .card-no-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #d6cfbe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      color: #9a9080;
    }

    .card-body {
      padding: 8px 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-title {
      font-family: var(--serif);
      font-size: 0.72rem;
      color: #1a1510;
      line-height: 1.35;
    }

    .card-id a {
      font-size: 0.55rem;
      color: #7a7060;
      text-decoration: none;
      word-break: break-all;
    }

    .card-id a:hover { color: var(--accent); text-decoration: underline; }

    .card-actions { margin-top: auto; }

    .keep-btn {
      width: 100%;
      border: 1px solid #c0b8a6;
      background: transparent;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      padding: 6px 0;
      color: #4a4035;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }

    .keep-btn:hover:not(:disabled) { background: #c8c0b0; }

    .keep-btn:disabled {
      background: #2a4e2a;
      border-color: #2a4e2a;
      color: #b0f0b0;
      cursor: default;
    }

    /* ── Controls bar ───────────────────────────────────────────────────── */
    #controls-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 14px 0;
      border-top: 1px solid #c8bfaf;
    }

    #next-btn, #prev-btn {
      background: transparent;
      border: 1px solid #b0a490;
      color: var(--text-on-dark);
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 20px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s;
    }

    #next-btn:hover:not(:disabled),
    #prev-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    #next-btn:disabled,
    #prev-btn:disabled { opacity: 0.28; cursor: default; }

    #cat-search-btn {
      margin-left: 8px;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 18px;
      cursor: pointer;
      transition: background 0.12s;
    }
    #cat-search-btn:hover:not(:disabled) { background: var(--accent-light); }
    #cat-search-btn:disabled { opacity: 0.35; cursor: default; }

    #status-msg {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    /* ── Selected section ───────────────────────────────────────────────── */
    #selected-section {
      border: 1px solid var(--selected-border);
      border-top: 2px solid var(--accent);
      background: var(--selected-bg);
      padding: 20px 20px 16px;
    }

    #selected-section .section-label { color: var(--accent); }
    #selected-section .section-stat  { color: var(--text-muted); }

    .empty-msg { color: #8a8070; }

    #selected-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 70px;
      padding: 12px 0 8px;
    }

    .sel-card {
      position: relative;
      width: 76px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      overflow: hidden;
    }

    .sel-remove {
      position: absolute;
      top: 3px; right: 3px;
      width: 16px; height: 16px;
      background: rgba(0,0,0,0.45);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 0.7rem;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      z-index: 1;
      transition: background 0.1s;
    }
    .sel-remove:hover { background: rgba(160,30,30,0.85); }

    .sel-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .sel-card-no-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #d6cfbe;
    }

    .sel-card-title {
      padding: 4px 5px;
      font-size: 0.52rem;
      color: #1a1510;
      line-height: 1.25;
      font-family: var(--mono);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .empty-msg {
      font-size: 0.65rem;
      color: #5a5448;
      font-style: italic;
      align-self: center;
    }

    #export-btn {
      margin-top: 12px;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 22px;
      cursor: pointer;
      transition: background 0.12s;
    }

    #export-btn:hover:not(:disabled) { background: var(--accent-light); }
    #export-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── Utility ────────────────────────────────────────────────────────── */
    .err { color: #c04848; font-size: 0.7rem; margin-top: 12px; }

    #pool-section[hidden] { display: none; }
  </style>
</head>
<body>

<header>
  <h1>Collection Curation</h1>
  <span>Wereld Museum · Linked Collection</span>
</header>

<div id="query-bar">
  {% if query_generation_mode == 'category_select' %}
    <label>Category</label>
    {% for cat in categories %}
      <button class="cat-btn" data-cat="{{ cat }}">{{ cat }}</button>
    {% endfor %}
    <button id="cat-search-btn" disabled>Search</button>
  {% else %}
    <label>Search</label>
    <form id="kw-form">
      <div id="keyword-wrap">
        <input id="keyword-input" type="text" placeholder="e.g. funeral masks, West Africa…" autocomplete="off">
        <button class="search-btn" type="submit">Search</button>
      </div>
    </form>
  {% endif %}
</div>

<div id="concept-tags" hidden></div>

<main>
  <div id="pool-section" hidden>
    <canvas id="cobweb" aria-hidden="true"></canvas>
    <div id="spider" aria-hidden="true">🕷</div>
    <div class="section-meta">
      <span class="section-label">Exploring</span>
      <span class="section-stat" id="pool-stat"></span>
    </div>
    <div id="pool-grid"></div>
    <div id="controls-bar">
      <button id="prev-btn" disabled>← Previous</button>
      <button id="next-btn" disabled>Next batch →</button>
      <span id="status-msg"></span>
    </div>
  </div>

  <div id="selected-section">
    <div class="section-meta">
      <span class="section-label">Selection</span>
      <span class="section-stat" id="sel-stat">0 items</span>
    </div>
    <div id="selected-grid">
      <span class="empty-msg">No items selected yet.</span>
    </div>
    <button id="export-btn" disabled>Export →</button>
  </div>

  <div id="err-area"></div>
</main>

<script>
  const N = {{ n_per_batch }};
  const MODE = "{{ query_generation_mode }}";

  /* ── State ──────────────────────────────────────────────────────────── */
  let pool     = [];   // full result pool for current search
  let selected = [];   // accumulated yes-picks — persists across searches
  let meta     = { query: '', sparql: '' };
  let serverHistory = { accepted: [], rejected: [], seen: [] };

  // Batch navigation: each entry is {displayed: [...], choices: {id: 'yes'|'no'}}
  // batchIdx points at what's currently shown; only atFrontier() triggers server calls.
  let batches  = [];
  let batchIdx = -1;

  function atFrontier() { return batches.length > 0 && batchIdx === batches.length - 1; }
  function curBatch()   { return batches[batchIdx] || { displayed: [] }; }
  function isKept(id)   { return selected.some(s => s.id === id); }

  /* ── DOM ────────────────────────────────────────────────────────────── */
  const poolSection = document.getElementById('pool-section');
  const poolGrid    = document.getElementById('pool-grid');
  const poolStat    = document.getElementById('pool-stat');
  const prevBtn     = document.getElementById('prev-btn');
  const nextBtn     = document.getElementById('next-btn');
  const statusMsg   = document.getElementById('status-msg');
  const selGrid     = document.getElementById('selected-grid');
  const selStat     = document.getElementById('sel-stat');
  const exportBtn   = document.getElementById('export-btn');
  const errArea     = document.getElementById('err-area');

  /* ── Helpers ────────────────────────────────────────────────────────── */
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function photoOf(item) { return item.properties?.url_photo || ''; }
  function shortId(id)   { return id.split('/').pop() || id; }
  function clearErr()    { errArea.innerHTML = ''; }
  function showErr(msg)  { errArea.innerHTML = `<p class="err">${esc(msg)}</p>`; }

  function mergePools(pools) {
    const seen = new Set();
    const out  = [];
    for (const p of pools) {
      for (const item of p) {
        const key = item.id + '||' + (item.properties?.url_photo || '');
        if (!seen.has(key)) { seen.add(key); out.push(item); }
      }
    }
    return out;
  }

  /* ── Nav button state ───────────────────────────────────────────────── */
  function updateNav() {
    prevBtn.disabled = batchIdx <= 0;
    if (!atFrontier()) {
      nextBtn.disabled    = false;
      nextBtn.textContent = 'Forward →';
    } else {
      const unseen = pool.filter(i => !serverHistory.seen.includes(i.id)).length;
      nextBtn.disabled    = pool.length > 0 && unseen === 0;
      nextBtn.textContent = 'Next batch →';
    }
    statusMsg.textContent = !atFrontier() ? '(browsing past)' : '';
  }

  /* ── Render pool ────────────────────────────────────────────────────── */
  function renderPool() {
    const { displayed } = curBatch();

    if (!displayed.length) {
      poolGrid.innerHTML = '<p style="color:var(--text-muted);font-size:.7rem;">Pool exhausted.</p>';
      nextBtn.disabled = true;
      return;
    }

    poolGrid.innerHTML = displayed.map(item => {
      const kept  = isKept(item.id);
      const photo = photoOf(item);
      const img   = photo
        ? `<img class="card-img" src="${esc(photo)}" alt="" loading="lazy">`
        : `<div class="card-no-img">no image</div>`;
      return `
        <div class="artifact-card${kept ? ' kept' : ''}" data-id="${esc(item.id)}">
          ${img}
          <div class="card-body">
            <div class="card-title">${esc(item.title)}</div>
            <div class="card-id"><a href="${esc(item.id)}" target="_blank" rel="noopener">${esc(shortId(item.id))}</a></div>
            <div class="card-actions">
              <button class="keep-btn"${kept ? ' disabled' : ''}>${kept ? '✓ Kept' : 'Keep'}</button>
            </div>
          </div>
        </div>`;
    }).join('');

    poolGrid.querySelectorAll('.artifact-card').forEach(card => {
      const id   = card.dataset.id;
      const item = displayed.find(i => i.id === id);
      const btn  = card.querySelector('.keep-btn');
      if (btn && item && !isKept(id)) {
        btn.addEventListener('click', () => keepItem(item, btn, card));
      }
    });

    const unseenCount = pool.filter(i => !serverHistory.seen.includes(i.id)).length;
    poolStat.textContent = `${unseenCount} remaining in pool`;
    updateNav();
  }

  /* ── Render selected ────────────────────────────────────────────────── */
  function renderSelected() {
    selStat.textContent = `${selected.length} item${selected.length !== 1 ? 's' : ''}`;
    if (!selected.length) {
      selGrid.innerHTML = '<span class="empty-msg">No items selected yet.</span>';
    } else {
      selGrid.innerHTML = selected.map(item => {
        const photo = photoOf(item);
        const img   = photo
          ? `<img src="${esc(photo)}" alt="" loading="lazy">`
          : `<div class="sel-card-no-img"></div>`;
        return `
          <div class="sel-card">
            <button class="sel-remove" data-id="${esc(item.id)}" title="Remove">×</button>
            ${img}
            <div class="sel-card-title">${esc(item.title)}</div>
          </div>`;
      }).join('');
      selGrid.querySelectorAll('.sel-remove').forEach(btn => {
        btn.addEventListener('click', () => removeItem(btn.dataset.id));
      });
    }
    exportBtn.disabled = selected.length === 0;
  }

  /* ── Keep ───────────────────────────────────────────────────────────── */
  function keepItem(item, btn, card) {
    selected.push(item);
    card.classList.add('kept');
    btn.disabled    = true;
    btn.textContent = '✓ Kept';
    renderSelected();
  }

  /* ── Remove from selected ───────────────────────────────────────────── */
  function removeItem(itemId) {
    const idx = selected.findIndex(s => s.id === itemId);
    if (idx === -1) return;
    selected.splice(idx, 1);
    const accIdx = serverHistory.accepted.indexOf(itemId);
    if (accIdx !== -1) serverHistory.accepted.splice(accIdx, 1);
    serverHistory.rejected.push(itemId);
    // Restore card in pool if currently visible
    const card = poolGrid.querySelector(`[data-id="${CSS.escape(itemId)}"]`);
    if (card) {
      card.classList.remove('kept');
      const btn  = card.querySelector('.keep-btn');
      const item = curBatch().displayed.find(i => i.id === itemId);
      if (btn && item) {
        btn.disabled    = false;
        btn.textContent = 'Keep';
        btn.addEventListener('click', () => keepItem(item, btn, card));
      }
    }
    renderSelected();
  }

  /* ── Concept tags ───────────────────────────────────────────────────── */
  const conceptTags = document.getElementById('concept-tags');

  function showConceptsLoading() {
    conceptTags.innerHTML = '<span class="concept-searching">Finding concepts</span>';
    conceptTags.hidden = false;
  }

  function renderConcepts(concepts) {
    conceptTags.innerHTML = '';
    if (!concepts || concepts.length === 0) {
      conceptTags.hidden = true;
      return;
    }
    const prefix = document.createElement('span');
    prefix.className = 'concept-prefix';
    prefix.textContent = 'Concepts:';
    conceptTags.appendChild(prefix);
    for (const c of concepts) {
      const chip = document.createElement('a');
      chip.className = 'concept-chip';
      chip.href = c.uri;
      chip.target = '_blank';
      chip.rel = 'noopener';
      chip.title = c.uri;
      chip.textContent = c.label;
      conceptTags.appendChild(chip);
    }
    conceptTags.hidden = false;
  }

  /* ── Search ─────────────────────────────────────────────────────────── */
  async function doSearch(queries) {
    clearErr();
    statusMsg.textContent = 'Querying…';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    if (queries.length === 1) showConceptsLoading();
    else conceptTags.hidden = true;

    // Reset navigation; selected persists intentionally
    batches       = [];
    batchIdx      = -1;
    serverHistory = { accepted: [], rejected: [], seen: [] };

    try {
      let firstPool, firstDisplayed, firstSparql;

      if (queries.length === 1) {
        const r = await fetch('/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: queries[0], n: N }),
        });
        const d = await r.json();
        if (!r.ok) { renderConcepts(d.concepts || []); throw new Error(d.error || 'Search failed'); }
        renderConcepts(d.concepts || []);
        firstPool      = d.pool;
        firstDisplayed = d.displayed;
        firstSparql    = d.sparql;
      } else {
        // Parallel requests for each category, then merge pools
        const results = await Promise.all(queries.map(q =>
          fetch('/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: q, n: N }),
          }).then(r => r.json())
        ));
        firstPool   = mergePools(results.map(d => d.pool));
        firstSparql = results.map(d => d.sparql).join('\n--- next query ---\n');
        // Ask the server's SelectionStrategy to pick the first batch
        const nr = await fetch('/next', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pool: firstPool, n: N, history: serverHistory }),
        });
        const nd = await nr.json();
        if (!nr.ok) throw new Error(nd.error || 'Failed to get first batch');
        firstDisplayed = nd.displayed;
      }

      pool = firstPool;
      meta = { query: queries.join(' + '), sparql: firstSparql };
      serverHistory.seen = firstDisplayed.map(i => i.id);

      batches  = [{ displayed: firstDisplayed }];
      batchIdx = 0;

      poolSection.hidden = false;
      renderPool();
      renderSelected();
    } catch (e) {
      showErr(e.message);
      statusMsg.textContent = '';
      // Hide any leftover loading animation (renderConcepts already called on HTTP errors)
      if (conceptTags.querySelector('.concept-searching')) conceptTags.hidden = true;
    }
  }

  /* ── Previous batch ─────────────────────────────────────────────────── */
  function prevBatch() {
    if (batchIdx <= 0) return;
    batchIdx -= 1;
    renderPool();
  }

  /* ── Next batch ─────────────────────────────────────────────────────── */
  async function nextBatch() {
    if (!atFrontier()) {
      // Just navigate forward through already-fetched batches
      batchIdx += 1;
      renderPool();
      return;
    }

    // At frontier: items not kept → rejected; fetch new batch
    const { displayed } = curBatch();
    const keptIds = new Set(selected.map(i => i.id));
    serverHistory.accepted.push(...displayed.filter(i =>  keptIds.has(i.id)).map(i => i.id));
    serverHistory.rejected.push(...displayed.filter(i => !keptIds.has(i.id)).map(i => i.id));

    nextBtn.disabled = true;
    statusMsg.textContent = 'Loading…';

    try {
      const r = await fetch('/next', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pool, n: N, history: serverHistory }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed');

      serverHistory.seen.push(...d.displayed.map(i => i.id));
      batches.push({ displayed: d.displayed });
      batchIdx = batches.length - 1;

      renderPool();
    } catch (e) {
      showErr(e.message);
      statusMsg.textContent = '';
      updateNav();
    }
  }

  /* ── Export ─────────────────────────────────────────────────────────── */
  async function doExport() {
    exportBtn.disabled = true;
    try {
      const r = await fetch('/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: selected, meta }),
      });
      if (!r.ok) {
        const d = await r.json();
        throw new Error(d.error || 'Export failed');
      }
      const blob = await r.blob();
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: 'exhibition.json' });
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      showErr(e.message);
    } finally {
      exportBtn.disabled = selected.length === 0;
    }
  }

  /* ── Wire up ────────────────────────────────────────────────────────── */
  prevBtn.addEventListener('click', prevBatch);
  nextBtn.addEventListener('click', nextBatch);
  exportBtn.addEventListener('click', doExport);

  if (MODE === 'category_select') {
    let selectedCats = new Set();
    const catSearchBtn = document.getElementById('cat-search-btn');

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        if (selectedCats.has(cat)) {
          selectedCats.delete(cat);
          btn.classList.remove('active');
        } else {
          selectedCats.add(cat);
          btn.classList.add('active');
        }
        catSearchBtn.disabled = selectedCats.size === 0;
      });
    });

    catSearchBtn.addEventListener('click', () => {
      if (selectedCats.size > 0) doSearch([...selectedCats]);
    });
  } else {
    document.getElementById('kw-form').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('keyword-input').value.trim();
      if (q) doSearch([q]);
    });
  }
</script>

<style>
  /* ── Cobweb easter egg ─────────────────────────────────────────────────── */
  #cobweb {
    position: absolute;
    top: 0; right: 0;
    width: 160px; height: 160px;
    pointer-events: none;
    opacity: 0.55;
    z-index: 0;
  }
  #spider {
    position: absolute;
    top: 82px; right: 14px;
    font-size: 0.95rem;
    pointer-events: none;
    z-index: 1;
    transform-origin: center top;
    animation: spidersway 6s ease-in-out infinite;
    opacity: 0.65;
  }
  @keyframes spidersway {
    0%, 100% { transform: rotate(-8deg); }
    50%       { transform: rotate(8deg); }
  }
  /* ensure pool content renders above canvas */
  #pool-section .section-meta,
  #pool-section #pool-grid,
  #pool-section #controls-bar { position: relative; z-index: 1; }
</style>
<script>
  (function () {
    const canvas = document.getElementById('cobweb');
    const dpr  = window.devicePixelRatio || 1;
    const size = 160;
    canvas.width  = size * dpr;
    canvas.height = size * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // Corner at top-right of the canvas
    const cx = size, cy = 0;
    const numSpokes = 8;
    const numRings  = 6;
    const maxR = size - 6;
    // Sweep from pointing left (π) down to pointing down (π*1.5)
    const a0 = Math.PI, a1 = Math.PI * 1.5;

    ctx.strokeStyle = '#7a5e20';  // accent colour — visible on parchment
    ctx.lineWidth   = 0.9;

    // Spokes
    for (let i = 0; i <= numSpokes; i++) {
      const a = a0 + (i / numSpokes) * (a1 - a0);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
      ctx.stroke();
    }

    // Rings (straight segments between spoke points, curved feel via short segments)
    for (let ring = 1; ring <= numRings; ring++) {
      const r = (ring / numRings) * maxR;
      ctx.beginPath();
      for (let i = 0; i <= numSpokes; i++) {
        const a = a0 + (i / numSpokes) * (a1 - a0);
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  })();

</script>
